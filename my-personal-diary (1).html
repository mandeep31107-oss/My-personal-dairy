<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="My Personal Diary — a private, encrypted digital journal. My Life. My Thoughts. My Story.">
<meta name="theme-color" content="#101010">
<title>My Personal Diary — My Life. My Thoughts. My Story.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Lora:ital,wght@0,400..700;1,400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ My Personal Diary — design system ============ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#101010; --bg2:#191919; --card:#202020; --card2:#262626;
  --text:#FFFFFF; --text2:#A0A0A0; --text3:#707070;
  --accent:#E98A45; --accent2:#F0A76B; --accent-soft:rgba(233,138,69,.13); --accent-glow:rgba(233,138,69,.4);
  --cream:#F1E9DC; --border:#303030; --border2:#3B3B3B;
  --danger:#E5635A; --danger-soft:rgba(229,99,90,.13); --ok:#8FBF98;
  --shadow:0 12px 32px rgba(0,0,0,.38);
  --shadow-sm:0 4px 14px rgba(0,0,0,.28);
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-serif:"Lora",Georgia,"Times New Roman",serif;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --r-sm:12px;
  --sb-w:236px; --ed-fs:17px;
}
html[data-theme="light"]{
  --bg:#F6F2EB; --bg2:#FBF8F2; --card:#FFFFFF; --card2:#FDFBF7;
  --text:#211C15; --text2:#6E6558; --text3:#A39A8C;
  --accent:#D9732E; --accent2:#C4611F; --accent-soft:rgba(217,115,46,.10); --accent-glow:rgba(217,115,46,.35);
  --cream:#F1E9DC; --border:#E7DFD0; --border2:#DCD3C2;
  --danger:#C45047; --danger-soft:rgba(196,80,71,.10); --ok:#4E8B5B;
  --shadow:0 12px 28px rgba(80,64,40,.10);
  --shadow-sm:0 4px 12px rgba(80,64,40,.08);
}
html[data-font="s"]{--ed-fs:15.5px} html[data-font="l"]{--ed-fs:19px}

/* ---------- personality palettes (neutral until chosen; same for everyone by default) ---------- */
html[data-palette="boy"]{--accent:#58A6D6;--accent2:#7FBFDF;--accent-soft:rgba(88,166,214,.14);--accent-glow:rgba(88,166,214,.4)}
html[data-palette="boy"][data-age="kid"]{--accent:#45B7E9;--accent2:#79CFF0;--accent-soft:rgba(69,183,233,.15);--accent-glow:rgba(69,183,233,.42)}
html[data-palette="boy"][data-age="adult"]{--accent:#6E93B8;--accent2:#8FB0CC;--accent-soft:rgba(110,147,184,.14);--accent-glow:rgba(110,147,184,.38)}
html[data-palette="girl"]{--accent:#EE7B9C;--accent2:#F49FB6;--accent-soft:rgba(238,123,156,.14);--accent-glow:rgba(238,123,156,.4)}
html[data-palette="girl"][data-age="kid"]{--accent:#F79AB6;--accent2:#FBB6C9;--accent-soft:rgba(247,154,182,.16);--accent-glow:rgba(247,154,182,.42)}
html[data-palette="girl"][data-age="adult"]{--accent:#C9839F;--accent2:#D9A0B7;--accent-soft:rgba(201,131,159,.14);--accent-glow:rgba(201,131,159,.38)}
html[data-theme="light"][data-palette="boy"]{--accent:#2F8FC0;--accent2:#27759F;--accent-soft:rgba(47,143,192,.10);--accent-glow:rgba(47,143,192,.32)}
html[data-theme="light"][data-palette="boy"][data-age="kid"]{--accent:#1E9FD6;--accent2:#157FAE;--accent-soft:rgba(30,159,214,.11);--accent-glow:rgba(30,159,214,.34)}
html[data-theme="light"][data-palette="boy"][data-age="adult"]{--accent:#4F7EA6;--accent2:#3F688A;--accent-soft:rgba(79,126,166,.10);--accent-glow:rgba(79,126,166,.30)}
html[data-theme="light"][data-palette="girl"]{--accent:#D65578;--accent2:#BC4464;--accent-soft:rgba(214,85,120,.10);--accent-glow:rgba(214,85,120,.32)}
html[data-theme="light"][data-palette="girl"][data-age="kid"]{--accent:#E0577F;--accent2:#C4456A;--accent-soft:rgba(224,87,127,.11);--accent-glow:rgba(224,87,127,.34)}
html[data-theme="light"][data-palette="girl"][data-age="adult"]{--accent:#A96080;--accent2:#8F4E69;--accent-soft:rgba(169,96,128,.10);--accent-glow:rgba(169,96,128,.30)}

html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 420px at 78% -12%,var(--accent-soft),transparent 62%)}
.hidden{display:none!important}
::selection{background:var(--accent);color:#141414}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
img{max-width:100%}
h1,h2,h3{font-weight:600}
button{font-family:inherit}
a{color:var(--accent)}

/* ---------- generic ---------- */
.page{max-width:1080px;margin:0 auto;padding:26px 30px 90px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.page-title{font-family:var(--f-display);font-size:clamp(24px,3vw,30px);font-weight:500;letter-spacing:-.01em}
.page-sub{color:var(--text2);font-size:13.5px;margin-top:4px}
.overline{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);font-weight:600}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;position:relative}
.card.hover{transition:border-color .15s,transform .15s,box-shadow .15s}
.card.hover:hover{border-color:var(--border2);box-shadow:var(--shadow-sm)}
.muted{color:var(--text2)} .faint{color:var(--text3)} .small{font-size:13px}
.serif{font-family:var(--f-serif)} .disp{font-family:var(--f-display)}
.divider{border:0;border-top:1px solid var(--border);margin:16px 0}
.accent{color:var(--accent)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g32{grid-template-columns:2fr 1fr}
.g23{grid-template-columns:1fr 2fr}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;background:var(--accent);color:#161006;transition:filter .15s,background .15s,transform .05s;white-space:nowrap;user-select:none}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:#181005}
html[data-theme="light"] .btn-primary{color:#FFF6EC}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--border2)}
.btn-ghost:hover{background:var(--card2);filter:none}
.btn-soft{background:var(--accent-soft);color:var(--accent)}
.btn-soft:hover{filter:none;background:var(--accent-soft);border-color:var(--accent)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-danger:hover{filter:none;border-color:var(--danger)}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:10px}
.btn-icon{padding:9px;border-radius:11px;background:transparent;color:var(--text2);border:1px solid transparent}
.btn-icon:hover{background:var(--card2);color:var(--text);filter:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link-btn{background:none;border:0;color:var(--accent);cursor:pointer;font-size:13.5px;font-weight:600;padding:0}
.link-btn:hover{text-decoration:underline}

/* ---------- inputs ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:600;color:var(--text2)}
.input,.select,.textarea{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:11px 14px;font-size:14px;font-family:inherit;transition:border-color .15s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent)}
.input::placeholder,.textarea::placeholder{color:var(--text3)}
.textarea{resize:vertical;min-height:90px;line-height:1.6}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text3) 50%),linear-gradient(135deg,var(--text3) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.frow{display:flex;gap:12px}.frow>*{flex:1}
.switch{position:relative;width:42px;height:24px;flex:none;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.switch .tr{position:absolute;inset:0;background:var(--border2);border-radius:99px;transition:.18s}
.switch .tr::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:var(--text2);transition:.18s}
.switch input:checked+.tr{background:var(--accent)}
.switch input:checked+.tr::before{transform:translateX(18px);background:#181005}
.chk-row{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;user-select:none}
.chk-row input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

/* ---------- chips / badges ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--border);border-radius:99px;padding:4px 12px;font-size:12.5px;color:var(--text2);cursor:pointer;transition:.15s;user-select:none}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip-x{border:0;background:none;color:inherit;cursor:pointer;font-size:14px;padding:0 0 0 2px;line-height:1;opacity:.7}
.chip-x:hover{opacity:1;color:var(--danger)}
.tag-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text3)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:99px;padding:3px 10px;background:var(--card2);color:var(--text2);border:1px solid var(--border)}
.badge.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge.warn{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.badge.ok{background:rgba(143,191,152,.14);color:var(--ok);border-color:transparent}
.cat-dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.mood-chip{display:inline-flex;flex-direction:column;align-items:center;gap:3px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:9px 6px;min-width:62px;cursor:pointer;font-size:10.5px;color:var(--text2);transition:.15s;user-select:none}
.mood-chip .em{font-size:19px;line-height:1;filter:grayscale(35%)}
.mood-chip:hover{border-color:var(--border2)}
.mood-chip.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.mood-chip.sel .em{filter:none}

/* ---------- auth ---------- */
.auth{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative;z-index:1}
.auth-card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:36px 34px 30px;box-shadow:var(--shadow);animation:fadeUp .3s ease}
.brand-mark{width:52px;height:52px;border-radius:16px;background:var(--accent-soft);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent);margin:0 auto 14px}
.auth-brand{text-align:center;margin-bottom:22px}
.auth-brand h1{font-family:var(--f-display);font-size:26px;font-weight:500;letter-spacing:-.01em}
.tagline{font-family:var(--f-serif);font-style:italic;color:var(--accent);font-size:14px;margin-top:5px}
.note-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--text2);line-height:1.6;margin:6px 0 14px}
.note-box strong{color:var(--text)}
.err-msg{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:9px 13px;font-size:13px;margin-bottom:12px;display:none}
.err-msg.show{display:block;animation:shake .3s}
.auth-foot{color:var(--text3);font-size:12px;margin-top:18px;text-align:center;max-width:420px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pin-dots{display:flex;gap:10px;justify-content:center;margin:18px 0}
.pin-dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--text3)}
.pin-dot.on{background:var(--accent);border-color:var(--accent)}

/* ---------- app shell ---------- */
.app{display:flex;min-height:100dvh;position:relative;z-index:1}
.sidebar{width:var(--sb-w);flex:none;position:fixed;top:0;bottom:0;left:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;z-index:40;overflow-y:auto}
.sb-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.sb-brand .bm{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none}
.sb-brand .t{font-family:var(--f-display);font-size:16.5px;line-height:1.2;font-weight:500}
.sb-nav{display:flex;flex-direction:column;gap:2px;flex:1}
.sb-sec{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text3);font-weight:700;padding:14px 10px 6px}
.sb-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;color:var(--text2);font-size:14px;font-weight:500;cursor:pointer;border:0;background:none;width:100%;text-align:left;transition:.14s;text-decoration:none}
.sb-item:hover{color:var(--text);background:var(--card)}
.sb-item.active{color:var(--accent);background:var(--accent-soft);font-weight:600}
.sb-item .cnt{margin-left:auto;font-size:11px;color:var(--text3);background:var(--card2);border-radius:99px;padding:1px 7px}
.sb-item.active .cnt{color:var(--accent);background:transparent}
.sb-foot{border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:2px}
.main{flex:1;margin-left:var(--sb-w);min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:12px 30px;display:flex;align-items:center;gap:12px}
.tb-date{font-family:var(--f-serif);font-style:italic;color:var(--text2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-search{flex:1;max-width:420px;display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:9px 14px;color:var(--text3);font-size:13.5px;cursor:pointer;transition:.15s;min-width:0}
.tb-search:hover{border-color:var(--border2);color:var(--text2)}
.tb-search .kbd{margin-left:auto;font-size:11px;border:1px solid var(--border2);border-radius:6px;padding:1px 6px;color:var(--text3);flex:none}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.bell{position:relative}
.bell-dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#181005;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;cursor:pointer;border:0;flex:none;user-select:none}
html[data-theme="light"] .avatar{color:#FFF6EC}
.view-wrap{flex:1;min-width:0}
#view{animation:fadeUp .18s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- dashboard ---------- */
.hero{margin:6px 0 20px}
.hero h1{font-family:var(--f-display);font-size:clamp(26px,4vw,36px);font-weight:500;letter-spacing:-.015em;line-height:1.15}
.hero .sub{color:var(--text2);font-size:14px;margin-top:6px}
.hero .sub .serif{color:var(--accent);font-style:italic}
.promo{display:flex;align-items:center;gap:18px;background:linear-gradient(120deg,var(--accent-soft),transparent 70%),var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;margin-bottom:18px;flex-wrap:wrap}
.promo .q{flex:1;min-width:220px}
.promo .q .overline{margin-bottom:6px;display:block}
.promo .q .qt{font-family:var(--f-serif);font-style:italic;font-size:17px;color:var(--text);line-height:1.5}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px}
.stat .n{font-family:var(--f-display);font-size:26px;font-weight:500;letter-spacing:-.01em}
.stat .l{font-size:12px;color:var(--text2);margin-top:2px}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 12px}
.sec-t h2{font-family:var(--f-display);font-size:19px;font-weight:500}
.today-card{border-color:var(--accent);background:linear-gradient(120deg,var(--accent-soft),transparent 55%),var(--card)}
.mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mini-cal .mc-dow{font-size:9.5px;color:var(--text3);font-weight:700;padding:4px 0;letter-spacing:.05em}
.mini-cal .mc-d{position:relative;font-size:12px;padding:6px 0;border-radius:8px;color:var(--text2)}
.mini-cal .mc-d.today{background:var(--accent-soft);color:var(--accent);font-weight:700}
.mini-cal .mc-d.has::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.mini-cal .mc-d.other{opacity:.28}

/* ---------- entry / memory cards ---------- */
.entry-card{cursor:pointer}
.entry-card .ec-t{font-family:var(--f-display);font-size:17px;font-weight:500;letter-spacing:-.01em}
.entry-card .ec-p{color:var(--text2);font-size:13.5px;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.6}
.entry-card .ec-m{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--text3)}
.fav-btn{border:0;background:none;cursor:pointer;color:var(--text3);padding:4px;border-radius:8px;line-height:0;flex:none}
.fav-btn:hover{color:var(--accent)}
.fav-btn.on{color:var(--accent)}
.mem-card{padding:0;overflow:hidden;cursor:pointer}
.mem-card .im{aspect-ratio:4/3;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--text3);overflow:hidden}
.mem-card .im img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.mem-card:hover .im img{transform:scale(1.03)}
.mem-card .mc-b{padding:14px 16px 16px}
.mem-card .mc-t{font-family:var(--f-display);font-size:15.5px;font-weight:500}
.empty{text-align:center;padding:52px 20px;color:var(--text2)}
.empty .eico{width:56px;height:56px;border-radius:18px;background:var(--bg2);border:1px dashed var(--border2);display:flex;align-items:center;justify-content:center;color:var(--text3);margin:0 auto 14px}
.empty .et{font-family:var(--f-serif);font-style:italic;font-size:16px;color:var(--text);margin-bottom:6px}
.empty .ed{font-size:13px;max-width:340px;margin:0 auto 16px}

/* ---------- diary list ---------- */
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filterbar .input,.filterbar .select{width:auto;min-width:130px;padding:8px 12px;font-size:13px;border-radius:10px}
.filterbar .input.grow{flex:1;min-width:170px}
.list-col{display:flex;flex-direction:column;gap:12px}

/* ---------- editor ---------- */
.ed-wrap{max-width:800px;margin:0 auto;padding:26px 30px 110px}
.ed-topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ed-title{width:100%;background:transparent;border:0;outline:none;color:var(--text);font-family:var(--f-display);font-size:clamp(24px,3.4vw,32px);font-weight:500;letter-spacing:-.01em;padding:2px 0 8px}
.ed-title::placeholder{color:var(--text3)}
.ed-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:6px}
.ed-meta .input,.ed-meta .select{width:auto;padding:7px 11px;font-size:13px;border-radius:10px;background:var(--card)}
.ed-toolbar{position:sticky;top:57px;z-index:20;display:flex;align-items:center;gap:2px;flex-wrap:wrap;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:12px;padding:5px;margin:12px 0;box-shadow:var(--shadow-sm)}
.tb-btn{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;border:0;background:none;border-radius:8px;color:var(--text2);cursor:pointer;font-size:13.5px;padding:0 7px}
.tb-btn:hover{background:var(--card2);color:var(--text)}
.tb-btn.on{color:var(--accent);background:var(--accent-soft)}
.tb-sep{width:1px;height:20px;background:var(--border2);margin:0 5px}
.ed-area{min-height:44vh;font-family:var(--f-serif);font-size:var(--ed-fs);line-height:1.85;color:var(--text);outline:none;padding:10px 2px 30px;caret-color:var(--accent);word-break:break-word}
.ed-area:empty::before,.ed-area.phe::before{content:attr(data-ph);color:var(--text3);font-style:italic;pointer-events:none}
.ed-area p{margin:0 0 .55em}
.ed-area h2,.ed-area h3{font-family:var(--f-display);line-height:1.3;margin:.9em 0 .4em;font-weight:500}
.ed-area h2{font-size:1.45em} .ed-area h3{font-size:1.2em}
.ed-area blockquote{border-left:3px solid var(--accent);padding:2px 0 2px 16px;margin:.8em 0;color:var(--text2);font-style:italic}
.ed-area ul,.ed-area ol{padding-left:1.5em;margin:0 0 .55em}
.ed-area li{margin:.2em 0}
.ed-area a{color:var(--accent)}
.ed-area img{border-radius:12px;margin:.5em 0;max-height:420px;display:block;box-shadow:var(--shadow-sm)}
.ed-area hr{border:0;border-top:1px solid var(--border2);margin:1.2em 0}
.ed-area ul.ck{list-style:none;padding-left:.3em}
.ed-area ul.ck li{position:relative;padding-left:30px;cursor:text}
.ed-area ul.ck li::before{content:"";position:absolute;left:2px;top:.42em;width:17px;height:17px;border:1.6px solid var(--text3);border-radius:5px;cursor:pointer}
.ed-area ul.ck li.done{color:var(--text3);text-decoration:line-through}
.ed-area ul.ck li.done::before{background:var(--accent);border-color:var(--accent)}
.ed-area ul.ck li.done::after{content:"";position:absolute;left:6.5px;top:.55em;width:7px;height:11px;border:solid #181005;border-width:0 2px 2px 0;transform:rotate(45deg);cursor:pointer;pointer-events:none}
.ed-foot{position:sticky;bottom:0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--border);padding:10px 2px;margin-top:8px}
.count-bar{font-size:12px;color:var(--text3);display:flex;gap:12px;flex-wrap:wrap}
.save-state{font-size:12.5px;color:var(--text2);display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.save-state::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--text3)}
.save-state.saving::before{background:var(--accent);animation:pulse 1s infinite}
.save-state.saved::before{background:var(--ok)}
.save-state.failed::before{background:var(--danger)}
.save-state.failed{color:var(--danger)}
@keyframes pulse{50%{opacity:.3}}
.refl{margin-top:8px}
.refl summary{cursor:pointer;color:var(--text2);font-size:13.5px;font-weight:600;padding:6px 0;list-style:none;display:flex;align-items:center;gap:8px}
.refl summary::-webkit-details-marker{display:none}
.refl summary .chev{transition:transform .15s}
.refl[open] summary .chev{transform:rotate(180deg)}
.refl .field{margin-top:10px}
.refl textarea{min-height:60px;font-family:var(--f-serif);font-size:15px}
.tagbox{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tagbox .input{width:150px;padding:6px 10px;font-size:12.5px;border-radius:99px}
.tagchip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:600}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cal-title{font-family:var(--f-display);font-size:22px;font-weight:500;min-width:170px}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:3px}
.seg button{border:0;background:none;color:var(--text2);font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--accent);color:#181005}
html[data-theme="light"] .seg button.on{color:#FFF6EC}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-size:11px;color:var(--text3);font-weight:700;text-align:center;padding:6px 0;letter-spacing:.06em}
.cal-cell{min-height:74px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 9px;cursor:pointer;font-size:13px;color:var(--text2);transition:.14s;display:flex;flex-direction:column;gap:4px}
.cal-cell:hover{border-color:var(--accent)}
.cal-cell.other{opacity:.35}
.cal-cell.today{border-color:var(--accent);color:var(--text);background:linear-gradient(130deg,var(--accent-soft),transparent 60%),var(--card)}
.cal-cell.has{color:var(--text)}
.cal-num{font-weight:600}
.cal-cnt{font-size:10.5px;color:var(--accent);margin-top:auto;font-weight:600;letter-spacing:.02em}
.wk-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk-day{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;min-height:120px;cursor:pointer;font-size:12px;color:var(--text2)}
.wk-day.today{border-color:var(--accent)}
.wk-day.has{color:var(--text)}
.wk-day .wk-e{font-size:11px;color:var(--text2);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:2px solid var(--accent);padding-left:6px}
.yr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.yr-m{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;cursor:pointer}
.yr-m:hover{border-color:var(--accent)}
.yr-m .ym-t{font-size:12px;font-weight:700;margin-bottom:6px;color:var(--text2)}
.yr-m .mini-cal .mc-d{padding:3.5px 0;font-size:10.5px}
.day-panel{margin-top:16px}

/* ---------- memories / goals / ideas ---------- */
.memgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:1.5px;background:var(--border2)}
.tl-item{position:relative;padding-bottom:22px}
.tl-item::before{content:"";position:absolute;left:-23px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2.5px solid var(--bg)}
.tl-date{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.04em;margin-bottom:6px}
.goal-card .g-title{font-family:var(--f-display);font-size:17px;font-weight:500}
.prog{height:7px;background:var(--bg2);border-radius:99px;overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.miles{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.mile{display:flex;align-items:center;gap:9px;font-size:13.5px;cursor:pointer}
.mile .box{width:17px;height:17px;border:1.6px solid var(--text3);border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;color:transparent}
.mile.done .box{background:var(--accent);border-color:var(--accent);color:#181005}
.mile.done span{text-decoration:line-through;color:var(--text3)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.idea-input{display:flex;gap:10px;margin-bottom:18px}
.idea-card .ic-text{font-family:var(--f-serif);font-size:14.5px;line-height:1.65;margin-top:4px;white-space:pre-wrap;word-break:break-word}

/* ---------- insights ---------- */
.heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;gap:3px;overflow-x:auto;padding-bottom:4px;width:max-content;max-width:100%}
.heat-cell{width:12px;height:12px;border-radius:3px;background:var(--card2)}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bar-col .bar{width:100%;max-width:38px;background:var(--accent);border-radius:6px 6px 3px 3px;min-height:2px;opacity:.85}
.bar-col .bl{font-size:10.5px;color:var(--text3);white-space:nowrap}
.bar-col .bv{font-size:11px;color:var(--text2);font-weight:600}
.hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.hbar-row .hb-l{width:110px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.hbar-row .hb-v{width:26px;text-align:right;color:var(--text3);font-size:12px;flex:none}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut-leg{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text2)}
.donut-leg .dl{display:flex;align-items:center;gap:8px}
.donut-leg .sw{width:10px;height:10px;border-radius:3px;flex:none}

/* ---------- search / modal / sheet / toast ---------- */
.search-ov{position:fixed;inset:0;z-index:80;background:rgba(8,8,8,.62);backdrop-filter:blur(5px);display:flex;align-items:flex-start;justify-content:center;padding:9vh 16px 16px}
.search-panel{width:100%;max-width:640px;background:var(--card);border:1px solid var(--border2);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;animation:fadeUp .18s ease;max-height:82vh;display:flex;flex-direction:column}
.sp-row{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.sp-row .input{background:transparent;border:0;font-size:16px;padding:0}
.sp-filters{padding:10px 18px;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp-res{overflow-y:auto;padding:8px}
.res-item{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border-radius:12px;cursor:pointer}
.res-item:hover{background:var(--card2)}
.res-ico{width:34px;height:34px;border-radius:10px;background:var(--bg2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none;margin-top:2px}
.res-t{font-size:14px;font-weight:600}
.res-s{font-size:12.5px;color:var(--text2);margin-top:2px;line-height:1.5}
.res-m{font-size:11px;color:var(--text3);margin-top:3px}
mark{background:var(--accent);color:#181005;border-radius:3px;padding:0 2px}
.sp-foot{padding:9px 18px;border-top:1px solid var(--border);font-size:11px;color:var(--text3);display:flex;gap:14px}
.modal-back{position:fixed;inset:0;z-index:90;background:rgba(8,8,8,.6);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:var(--card);border:1px solid var(--border2);border-radius:18px;padding:24px;box-shadow:var(--shadow);animation:fadeUp .18s ease}
.modal-lg{max-width:640px}
.modal h3{font-family:var(--f-display);font-size:19px;font-weight:500;margin-bottom:4px}
.sheet{position:fixed;inset:0;z-index:70;background:rgba(8,8,8,.55);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet-in{width:100%;max-width:480px;background:var(--card);border:1px solid var(--border2);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheet-it{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px 8px;cursor:pointer;font-size:12.5px;color:var(--text2);font-weight:600}
.sheet-it:hover{border-color:var(--accent);color:var(--text)}
.sheet-it .si{color:var(--accent)}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
.toast{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--border2);color:var(--text);border-radius:13px;padding:11px 16px;font-size:13.5px;box-shadow:var(--shadow);animation:fadeUp .2s ease;max-width:92vw}
.toast.error{border-color:var(--danger);color:var(--danger)}
.toast.ok{border-color:var(--ok)}
.toast .link-btn{flex:none}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#181005;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px var(--accent-glow)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border:0;background:none;color:var(--text3);font-size:10px;font-weight:600;cursor:pointer;border-radius:10px}
.bn-item.active{color:var(--accent)}
.bn-add{flex:0 0 56px;display:flex;align-items:center;justify-content:center}
.bn-add .b{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#181005;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;box-shadow:0 6px 18px var(--accent-glow);margin-top:-16px}
.dropdown{position:fixed;z-index:110;background:var(--card);border:1px solid var(--border2);border-radius:14px;box-shadow:var(--shadow);padding:7px;min-width:190px;animation:fadeUp .14s ease}
.dd-it{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--text);font-size:13.5px;padding:9px 11px;border-radius:9px;cursor:pointer;text-align:left}
.dd-it:hover{background:var(--card2)}
.dd-it.danger{color:var(--danger)}
.dd-head{padding:8px 11px;font-size:11px;color:var(--text3);border-bottom:1px solid var(--border);margin-bottom:5px}
.offline-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:3px 9px;font-weight:600}

/* ---------- settings ---------- */
.set-sec{margin-bottom:18px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:0}
.set-row .sr-l{min-width:0}
.set-row .sr-t{font-size:14px;font-weight:600}
.set-row .sr-d{font-size:12.5px;color:var(--text2);margin-top:2px;line-height:1.5}
.cat-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.cat-row:last-child{border-bottom:0}
.cat-row .input{padding:7px 11px;font-size:13px}
input[type="color"].colpick{width:34px;height:34px;padding:2px;border:1px solid var(--border);border-radius:10px;background:var(--bg2);cursor:pointer}
.usage-bar{height:9px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.usage-bar i{display:block;height:100%;background:var(--accent)}

/* ---------- responsive ---------- */
@media (max-width:1023px){
  .sidebar{display:none}
  .main{margin-left:0;padding-bottom:70px}
  .topbar{padding:10px 16px}
  .page{padding:20px 16px 100px}
  .ed-wrap{padding:18px 16px 120px}
  .statgrid{grid-template-columns:repeat(2,1fr)}
  .memgrid{grid-template-columns:repeat(2,1fr)}
  .g2,.g3,.g32,.g23{grid-template-columns:1fr}
  .yr-grid{grid-template-columns:repeat(2,1fr)}
}
@media (min-width:1024px){.bottomnav,.fab{display:none!important}}
@media (max-width:640px){
  .memgrid{grid-template-columns:1fr}
  .statgrid{grid-template-columns:repeat(2,1fr)}
  .cal-cell{min-height:56px;padding:5px 6px;font-size:11.5px}
  .cal-cnt{font-size:9px}
  .wk-strip{grid-template-columns:1fr;gap:6px}
  .wk-day{min-height:0}
  .frow{flex-direction:column}
  .cal-cell .hide-s{display:none}
  .tb-date{display:none}
  .promo{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- print ---------- */
#printRoot{display:none}
@media print{
  body::before{display:none}
  .app,.auth,.search-ov,.modal-back,.sheet,.toasts,.bottomnav,.fab{display:none!important}
  body{background:#fff;color:#111}
  #printRoot{display:block;font-family:Georgia,serif;color:#111;padding:24px;max-width:720px;margin:0 auto}
  #printRoot h1{font-size:26px;margin-bottom:2px}
  #printRoot .pr-sub{color:#666;font-size:13px;font-style:italic;margin-bottom:22px}
  #printRoot .pr-entry{margin-bottom:26px;page-break-inside:avoid}
  #printRoot .pr-date{color:#B4562B;font-size:12px;font-weight:bold;letter-spacing:.06em;text-transform:uppercase}
  #printRoot .pr-t{font-size:19px;margin:3px 0 8px}
  #printRoot .pr-body{font-size:14px;line-height:1.8}
  #printRoot .pr-meta{color:#888;font-size:12px;margin-bottom:6px}
  #printRoot img{max-width:100%;border-radius:6px}
}
</style>

<body>
<noscript><p style="padding:30px;font-family:sans-serif">My Personal Diary needs JavaScript. Please enable it and reload.</p></noscript>

<!-- ======== Auth / Lock screen ======== -->
<div id="authScreen" class="auth">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-mark" id="brandIcon"></div>
      <h1>My Personal Diary</h1>
      <p class="tagline">My Life. My Thoughts. My Story.</p>
    </div>
    <div id="authBody"></div>
  </div>
  <p class="auth-foot">Private by design — your words are encrypted and stored only in this browser. Nothing is ever sent to a server.</p>
</div>

<!-- ======== App shell ======== -->
<div id="app" class="app hidden">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="view-wrap"><div id="view"></div></div>
  </div>
  <nav class="bottomnav" id="bottomNav"></nav>
</div>

<div id="moreSheet" class="sheet hidden"></div>
<button id="fab" class="fab hidden" data-act="quick-menu" aria-label="Quick add"></button>

<!-- ======== Global search overlay ======== -->
<div id="searchOverlay" class="search-ov hidden" onmousedown="if(event.target===this)closeSearch()">
  <div class="search-panel" role="dialog" aria-label="Search">
    <div class="sp-row">
      <span id="spIco" style="color:var(--text3)"></span>
      <input id="spInput" class="input" placeholder="Search your diary, memories, goals, ideas…" autocomplete="off" spellcheck="false">
      <button class="btn-icon btn" data-act="close-search" aria-label="Close search" id="spClose"></button>
    </div>
    <div class="sp-filters" id="spFilters"></div>
    <div class="sp-res" id="spRes"></div>
    <div class="sp-foot"><span>↵ open</span><span>Esc close</span><span id="spCount"></span></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="dropdownRoot"></div>
<div id="toastRoot" class="toasts"></div>
<div id="printRoot"></div>

<input type="file" id="imgInput" accept="image/*" multiple class="hidden">
<input type="file" id="importInput" accept=".json,application/json" class="hidden">

<script>
/* ================= My Personal Diary — core ================= */
'use strict';
const MPD_VERSION='1.0.0';
const K_META='mpd.meta.v1', K_DATA='mpd.data.v1', K_DRAFT='mpd.draft.v1', K_KEY='mpd.key.v1';
const enc=new TextEncoder(), dec=new TextDecoder();

/* ---------- tiny utils ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const pad2=n=>String(n).padStart(2,'0');
const todayISO=(d=new Date())=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parseISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};

/* ---------- crypto (real client-side encryption) ---------- */
function bufToB64(buf){const u=new Uint8Array(buf);let s='';const CH=0x8000;for(let i=0;i<u.length;i+=CH)s+=String.fromCharCode.apply(null,u.subarray(i,i+CH));return btoa(s);}
function b64ToBuf(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}
async function deriveKeys(password,saltBuf){
 const base=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:saltBuf,iterations:310000},base,512);
 const aesRaw=bits.slice(0,32),hmacRaw=bits.slice(32,64);
 const aesKey=await crypto.subtle.importKey('raw',aesRaw,'AES-GCM',false,['encrypt','decrypt']);
 const hmacKey=await crypto.subtle.importKey('raw',hmacRaw,{name:'HMAC',hash:'SHA-256'},false,['sign']);
 return{aesKey,hmacKey,aesRaw,hmacRaw};}
async function encJSON(key,obj){
 const iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));
 return bufToB64(iv)+'.'+bufToB64(ct);}
async function decJSON(key,packed){
 const i=packed.indexOf('.');const iv=new Uint8Array(b64ToBuf(packed.slice(0,i)));
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,b64ToBuf(packed.slice(i+1)));
 return JSON.parse(dec.decode(pt));}
async function hmacHex(hmacKey,msg){const h=await crypto.subtle.sign('HMAC',hmacKey,enc.encode(msg));return bufToB64(h);}

async function unlockWithPassword(pw){

 if(!pw)return showErr(err,'Please enter your password.');
 authBusy(true,'#lkBtn','Decrypting your diary…');
 try{
  const salt=b64ToBuf(S.meta.salt);
  const keys=await deriveKeys(pw,salt);
  await decJSON(keys.aesKey,S.meta.check);
  S.keys=keys;
  const raw=localStorage.getItem(K_DATA);
  S.data=migrate(raw?await decJSON(keys.aesKey,raw):defStore(S.meta.name,S.meta.email));
  stayUnlockedSync();
  enterApp();
 }catch(ex){
  console.warn('unlock failed',ex);
  authBusy(false,'#lkBtn');
  showErr(err,ex.name==='OperationError'?'That password does not unlock this diary. Please try again.':'Could not unlock: '+ex.message);
 }}

async function boot(){
 $('#brandIcon').innerHTML=ic('pen',26);
 $('#spIco').innerHTML=ic('search',18);
 $('#spClose').innerHTML=ic('x',16);
 $('#fab').innerHTML=ic('plus',24);
 let meta=null;try{meta=JSON.parse(localStorage.getItem(K_META)||'null');}catch(e){meta=null;}
 if(!meta||!meta.salt||!meta.check){renderSetup();return;}
 S.meta=meta;
 applyTheme();
 const kb=sessionStorage.getItem(K_KEY);
 if(kb){
  try{
   const k=JSON.parse(kb);
   const aesKey=await crypto.subtle.importKey('raw',b64ToBuf(k.a),'AES-GCM',false,['encrypt','decrypt']);
   const hmacKey=await crypto.subtle.importKey('raw',b64ToBuf(k.h),{name:'HMAC',hash:'SHA-256'},false,['sign']);
   S.keys={aesKey,hmacKey,aesRaw:b64ToBuf(k.a),hmacRaw:b64ToBuf(k.h)};
   const raw=localStorage.getItem(K_DATA);
   S.data=migrate(raw?await decJSON(aesKey,raw):defStore(S.meta.name,S.meta.email));
   if(S.data.settings.pinEnabled){renderPin();return;}
   enterApp();return;
  }catch(ex){console.warn('session restore failed',ex);sessionStorage.removeItem(K_KEY);S.keys=null;S.data=null;}
 }
 renderLock();}

function liveEntries(){return S.data.entries.filter(e=>!e.deletedAt);}
function byDateDesc(a,b){return b.date===a.date?(b.updatedAt||0)-(a.updatedAt||0):(b.date<a.date?-1:1);}
function streaks(){
 const set=new Set(liveEntries().map(e=>e.date));
 let cur=0,d=new Date();
 if(!set.has(todayISO(d)))d=addDays(d,-1);
 while(set.has(todayISO(d))){cur++;d=addDays(d,-1);}
 const dates=[...set].sort();let best=0,run=0,prev=null;
 for(const ds of dates){if(prev&&parseISO(ds)-parseISO(prev)===86400000)run++;else run=1;best=Math.max(best,run);prev=ds;}
 return{cur,best};}
function onThisDay(){
 const t=todayISO();const md=t.slice(5);const yr=Number(t.slice(0,4));
 return liveEntries().filter(e=>e.date.slice(5)===md&&Number(e.date.slice(0,4))<yr).sort(byDateDesc);}
function dayOfYear(d=new Date()){return Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);}

function miniCalHTML(y,m,clickable=true){
 const base=new Date(y,m,1);
 const first=(base.getDay()+6)%7; /* Monday-first */
 const dim=new Date(y,m+1,0).getDate();
 const t=todayISO();const counts={};
 liveEntries().forEach(e=>{counts[e.date]=(counts[e.date]||0)+1;});
 let cells='';
 for(const l of ['M','T','W','T','F','S','S'])cells+=`<div class="mc-dow">${l}</div>`;
 for(let i=0;i<first;i++)cells+=`<div class="mc-d other"></div>`;
 for(let d=1;d<=dim;d++){
  const iso=`${y}-${pad2(m+1)}-${pad2(d)}`;
  const act=clickable&&counts[iso];
  cells+=`<div class="mc-d ${iso===t?'today':''} ${act?'has':''}" ${clickable?`data-act="mini-day" data-date="${iso}" title="${counts[iso]||0} entr${(counts[iso]||0)===1?'y':'ies'}"`:''}>${d}</div>`;
 }
 return `<div class="mini-cal">${cells}</div>`;}

function compressImage(file,max=1200,q=.72){
 return new Promise((res,rej)=>{
  if(!/image\//.test(file.type))return rej(new Error('Not an image'));
  if(file.size>8*1024*1024)return rej(new Error('Image is larger than 8 MB'));
  const r=new FileReader();
  r.onload=()=>{
   if(/gif|svg/.test(file.type))return res(r.result);
   const img=new Image();
   img.onload=()=>{
    let{width:w,height:h}=img;
    const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    res(c.toDataURL('image/jpeg',q));};
   img.onerror=()=>rej(new Error('Could not read image'));
   img.src=r.result;};
  r.onerror=()=>rej(new Error('Could not read file'));
  r.readAsDataURL(file);});}

function calShift(dir){
 const c=S.cal;
 if(c.mode==='month'){const y=c.ym.getFullYear(),m=c.ym.getMonth();c.ym=new Date(y,m+dir,1);}
 else if(c.mode==='week'){c.anchor=addDays(c.anchor||new Date(),7*dir);}
 else{const y=c.ym.getFullYear();c.ym=new Date(y+dir,c.ym.getMonth(),1);}
 renderRoute();}
VIEWS.calendar=()=>{
 const c=S.cal;const t=todayISO();
 const counts={};liveEntries().forEach(e=>{counts[e.date]=(counts[e.date]||0)+1;});
 const entriesByDate=iso=>liveEntries().filter(e=>e.date===iso).sort(byDateDesc);
 let body='';
 if(c.mode==='month'){
  const y=c.ym.getFullYear(),m=c.ym.getMonth();
  const first=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
  let cells='';
  for(const l of ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'])cells+=`<div class="cal-dow">${l}</div>`;
  for(let i=0;i<first;i++)cells+=`<div class="cal-cell other" style="cursor:default"></div>`;
  for(let d=1;d<=dim;d++){
   const iso=`${y}-${pad2(m+1)}-${pad2(d)}`;const es=counts[iso];
   cells+=`<div class="cal-cell ${iso===t?'today':''} ${es?'has':''}" data-act="cal-day" data-date="${iso}">
    <span class="cal-num">${d}</span>
    ${es?`<span class="cal-cnt">${es} entr${es===1?'y':'ies'}</span>`:'<span class="cal-cnt faint hide-s">—</span>'}</div>`;
  }
  body=`<div class="cal-grid">${cells}</div>`;
 }else if(c.mode==='week'){
  const anchor=c.anchor||new Date();
  const monday=addDays(anchor,-((anchor.getDay()+6)%7));
  let cols='';
  for(let i=0;i<7;i++){
   const d=addDays(monday,i),iso=todayISO(d),es=entriesByDate(iso);
   cols+=`<div class="wk-day ${iso===t?'today':''} ${es.length?'has':''}" data-act="cal-day" data-date="${iso}">
    <div class="small" style="font-weight:700;color:${iso===t?'var(--accent)':'var(--text2)'}">${d.toLocaleDateString('en-GB',{weekday:'short'})} ${d.getDate()}</div>
    ${es.slice(0,3).map(e=>`<div class="wk-e">${esc(e.title||'Untitled')}</div>`).join('')}
    ${es.length>3?`<div class="faint" style="font-size:11px;margin-top:4px">+${es.length-3} more</div>`:''}
   </div>`;
  }
  body=`<div class="wk-strip">${cols}</div>`;
 }else{
  const y=c.ym.getFullYear();
  let months='';
  for(let m=0;m<12;m++){
   months+=`<div class="yr-m" data-act="cal-month" data-m="${m}">
    <div class="ym-t">${new Date(y,m,1).toLocaleDateString('en-GB',{month:'long'})}</div>
    ${miniCalHTML(y,m,false)}</div>`;
  }
  body=`<div class="yr-grid">${months}</div>`;
 }
 const sel=S.cal.sel?entriesByDate(S.cal.sel):null;
 const otd=onThisDay();
 $('#view').innerHTML=`<div class="page">
  <div class="page-head">
   <div><h1 class="page-title">Calendar</h1><div class="page-sub">Every day is a page — see where your story lives.</div></div>
  </div>
  <div class="cal-head">
   <button class="btn-icon btn" data-act="cal-prev" aria-label="Previous">${ic('chevL',18)}</button>
   <div class="cal-title">${c.mode==='week'?'Week of '+(c.anchor||new Date()).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):c.ym.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</div>
   <button class="btn-icon btn" data-act="cal-next" aria-label="Next">${ic('chevR',18)}</button>
   <button class="btn btn-ghost btn-sm" data-act="cal-today">Today</button>
   <div class="seg" style="margin-left:auto">
    <button class="${c.mode==='month'?'on':''}" data-act="cal-mode" data-mode="month">Month</button>
    <button class="${c.mode==='week'?'on':''}" data-act="cal-mode" data-mode="week">Week</button>
    <button class="${c.mode==='year'?'on':''}" data-act="cal-mode" data-mode="year">Year</button>
   </div>
  </div>
  ${body}
  ${sel?`<div class="day-panel">
   <div class="sec-t"><h2>${fmtLong(S.cal.sel)}</h2><button class="btn btn-soft btn-sm" data-act="cal-write" data-date="${S.cal.sel}">${ic('plus',14)} Write for this day</button></div>
   ${sel.length?`<div class="list-col">${sel.map(e=>entryCard(e,true)).join('')}</div>`:`<div class="card"><p class="muted small">No entries on this day yet.</p></div>`}
  </div>`:''}
  <div class="sec-t" style="margin-top:26px"><h2>On This Day</h2><span class="overline">${t.slice(5)}</span></div>
  ${otd.length?`<div class="list-col">${otd.map(e=>entryCard(e,true)).join('')}</div>
   <p class="faint small" style="margin-top:10px">${otd.length} memory from a past ${otd.length===1?'year':'years'} — only pages you actually wrote.</p>`
  :`<div class="card"><p class="muted small" style="font-style:italic">Nothing from previous years on this date — yet. Future you may visit this page.</p></div>`}
 </div>`;};
Object.assign(ACTIONS,{
 'cal-prev':()=>calShift(-1),
 'cal-next':()=>calShift(1),
 'cal-today':()=>{S.cal.ym=new Date();S.cal.anchor=new Date();S.cal.sel=todayISO();renderRoute();},
 'cal-mode':t=>{S.cal.mode=t.dataset.mode;S.cal.anchor=S.cal.anchor||new Date();renderRoute();},
 'cal-day':t=>{S.cal.sel=t.dataset.date;if(S.cal.mode!=='month')S.cal.anchor=parseISO(t.dataset.date);renderRoute();},
 'cal-month':t=>{S.cal.mode='month';S.cal.ym=new Date(S.cal.ym.getFullYear(),Number(t.dataset.m),1);renderRoute();},
 'cal-write':t=>{window.__edPresetDate=t.dataset.date;nav('entry','new');}});

VIEWS.memories=()=>{
 const q=(S.memQ||'').toLowerCase();
 const favOnly=!!S.memFav;
 let list=[...S.data.memories].sort((a,b)=>b.date<a.date?-1:1);
 list=list.filter(m=>!q||(m.title||'').toLowerCase().includes(q)||(m.description||'').toLowerCase().includes(q)||m.tags.some(t=>t.toLowerCase().includes(q)));
 if(S.memCat)list=list.filter(m=>m.categoryId===S.memCat);
 if(favOnly)list=list.filter(m=>m.favorite);
 const view=S.memView||'gallery';
 const cats=[...S.data.categories].sort((a,b)=>a.name.localeCompare(b.name));
 let body='';
 if(view==='gallery'){
  body=list.length?`<div class="memgrid">${list.map(m=>{const cat=catById(m.categoryId);return `
   <article class="card hover mem-card" data-act="mem-edit" data-id="${m.id}">
    <div class="im">${m.images&&m.images.length?`<img src="${m.images[0]}" alt="${esc(m.title)}" loading="lazy">`:ic('image',30)}</div>
    <div class="mc-b">
     <div class="spread"><div class="mc-t">${esc(m.title||'Untitled memory')}</div>
      <button class="fav-btn ${m.favorite?'on':''}" data-act="mem-fav" data-id="${m.id}" aria-label="Favorite">${ic('heart',15)}</button></div>
     <div class="small muted serif" style="font-style:italic">${fmtMed(m.date)}</div>
     ${m.tags.length?`<div class="row wrap" style="gap:7px;margin-top:7px">${m.tags.slice(0,3).map(t=>`<span class="tag-chip">${ic('tag',11)}${esc(t)}</span>`).join('')}</div>`:''}
     ${cat?`<div class="row" style="gap:6px;margin-top:8px"><span class="cat-dot" style="background:${cat.color}"></span><span class="faint" style="font-size:12px">${esc(cat.name)}</span></div>`:''}
    </div></article>`;}).join('')}</div>`
  :`<div class="empty"><div class="eico">${ic('image',22)}</div><div class="et">No memories saved yet.</div><div class="ed">A photograph, a milestone, a day worth keeping — give it a home here.</div><button class="btn btn-primary" data-act="mem-add">${ic('plus',15)} Add your first memory</button></div>`;
 }else{
  const groups={};
  list.forEach(m=>{(groups[m.date.slice(0,4)]=groups[m.date.slice(0,4)]||[]).push(m);});
  const years=Object.keys(groups).sort().reverse();
  body=list.length?years.map(y=>`<div class="overline" style="margin:20px 0 14px">${y}</div><div class="timeline">
   ${groups[y].map(m=>{const cat=catById(m.categoryId);return `<div class="tl-item" style="cursor:pointer" data-act="mem-edit" data-id="${m.id}">
    <div class="tl-date">${fmtMed(m.date)}${cat?` · <span style="color:${cat.color}">${esc(cat.name)}</span>`:''}${m.favorite?' · <span class="accent">♥ favorite</span>':''}</div>
    <div class="disp" style="font-size:16px">${esc(m.title||'Untitled memory')}</div>
    ${m.description?`<div class="muted small" style="margin-top:4px;line-height:1.6;max-width:640px">${esc(m.description)}</div>`:''}
    ${m.images&&m.images.length?`<div class="row wrap" style="gap:8px;margin-top:8px">${m.images.slice(0,4).map(s=>`<img src="${s}" style="width:74px;height:74px;object-fit:cover;border-radius:10px" alt="">`).join('')}</div>`:''}
   </div>`;}).join('')}</div>`).join('')
  :`<div class="empty"><div class="eico">${ic('image',22)}</div><div class="et">The timeline is empty.</div><div class="ed">Memories you save will appear here, year by year.</div><button class="btn btn-primary" data-act="mem-add">${ic('plus',15)} Add a memory</button></div>`;
 }
 $('#view').innerHTML=`<div class="page">
  <div class="page-head">
   <div><h1 class="page-title">Memories</h1><div class="page-sub">${S.data.memories.length} moments worth keeping</div></div>
   <button class="btn btn-primary" data-act="mem-add">${ic('plus',15)} Add memory</button>
  </div>
  <div class="filterbar">
   <input id="memQ" class="input grow" placeholder="Search memories…" value="${esc(S.memQ||'')}">
   <select id="memCat" class="select"><option value="">All categories</option>${cats.map(c=>`<option value="${c.id}" ${S.memCat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
   <button class="chip ${favOnly?'on':''}" id="memFavBtn">${ic('heart',13)} Favorites</button>
   <div class="seg" style="margin-left:auto"><button class="${view==='gallery'?'on':''}" data-act="mem-view" data-view="gallery">Gallery</button><button class="${view==='timeline'?'on':''}" data-act="mem-view" data-view="timeline">Timeline</button></div>
  </div>
  ${body}</div>`;
 const rerun=debounce(()=>{S.memQ=$('#memQ').value;renderRoute();const el=$('#memQ');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},350);
 $('#memQ').addEventListener('input',rerun);
 $('#memFavBtn').onclick=()=>{S.memFav=!S.memFav;renderRoute();};
 $('#memCat').onchange=e=>{S.memCat=e.target.value;renderRoute();};};
function memThumb(src,i){return `<div style="position:relative"><img src="${src}" style="width:78px;height:78px;object-fit:cover;border-radius:10px" alt=""><button class="chip-x" data-x="rmi" data-i="${i}" style="position:absolute;top:2px;right:2px;background:var(--card);border-radius:50%;width:18px;height:18px;text-align:center">&times;</button></div>`;}
function memoryForm(id){
 const m=id?S.data.memories.find(x=>x.id===id):null;
 const imgs=m?[...(m.images||[])]:[];
 const cats=[...S.data.categories].sort((a,b)=>a.name.localeCompare(b.name));
 const back=openModal(`<h3>${m?'Edit memory':'New memory'}</h3><p class="muted small" style="margin-bottom:14px">A moment, a photo, a milestone — keep it safe.</p>
  <div class="field"><label>Title</label><input id="mmTitle" class="input" placeholder="e.g. The trip to the coast" value="${esc(m?.title||'')}"></div>
  <div class="frow">
   <div class="field"><label>Date</label><input type="date" id="mmDate" class="input" value="${m?.date||todayISO()}"></div>
   <div class="field"><label>Category <span class="faint">(optional)</span></label><select id="mmCat" class="select"><option value="">None</option>${cats.map(c=>`<option value="${c.id}" ${m?.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
  </div>
  <div class="field"><label>Description</label><textarea id="mmDesc" class="textarea" placeholder="What makes this worth remembering?">${esc(m?.description||'')}</textarea></div>
  <div class="field"><label>Tags <span class="faint">(comma separated)</span></label><input id="mmTags" class="input" placeholder="travel, family, milestone" value="${esc((m?.tags||[]).join(', '))}"></div>
  <div class="field"><label>Photos</label>
   <div class="row wrap" id="mmThumbs">${imgs.map((s,i)=>memThumb(s,i)).join('')}</div>
   <button class="btn btn-ghost btn-sm" data-x="addimg">${ic('image',14)} Add photos</button>
   <input type="file" id="mmFile" accept="image/*" multiple class="hidden">
  </div>
  <label class="chk-row" style="margin-bottom:16px"><input type="checkbox" id="mmFav" ${m?.favorite?'checked':''}><span>Mark as a favorite memory</span></label>
  <div class="row" style="justify-content:flex-end;gap:10px">
   ${m?`<button class="btn btn-danger btn-sm" data-x="del" style="margin-right:auto">${ic('trash',14)} Delete</button>`:''}
   <button class="btn btn-ghost btn-sm" data-x="c">Cancel</button>
   <button class="btn btn-primary btn-sm" data-x="s">${ic('check',14)} Save memory</button>
  </div>`,{large:true});
 const renderThumbs=()=>{back.querySelector('#mmThumbs').innerHTML=imgs.map((s,i)=>memThumb(s,i)).join('');};
 back.querySelector('[data-x=addimg]').onclick=()=>back.querySelector('#mmFile').click();
 back.querySelector('#mmFile').addEventListener('change',async ev=>{
  for(const f of [...ev.target.files]){
   try{imgs.push(await compressImage(f,1000,.7));}catch(ex){toast(ex.message,'error');}}
  renderThumbs();ev.target.value='';});
 back.querySelector('#mmThumbs').addEventListener('click',e=>{
  const b=e.target.closest('[data-x=rmi]');if(!b)return;
  imgs.splice(Number(b.dataset.i),1);renderThumbs();});
 back.querySelector('[data-x=c]').onclick=()=>back.remove();
 if(m)back.querySelector('[data-x=del]').onclick=async()=>{
  if(!await confirmDlg({title:'Delete this memory?',danger:true,ok:'Delete memory',msg:'This cannot be undone.'}))return;
  S.data.memories=S.data.memories.filter(x=>x.id!==m.id);await persist();back.remove();renderRoute();toast('Memory deleted.','ok');};
 back.querySelector('[data-x=s]').onclick=async()=>{
  const title=back.querySelector('#mmTitle').value.trim();
  if(!title)return toast('Give this memory a title.','error');
  const data={id:m?m.id:uid(),title,date:back.querySelector('#mmDate').value||todayISO(),
   categoryId:back.querySelector('#mmCat').value||null,
   description:back.querySelector('#mmDesc').value.trim(),
   tags:back.querySelector('#mmTags').value.split(',').map(s=>s.trim()).filter(Boolean),
   favorite:back.querySelector('#mmFav').checked,images:imgs,createdAt:m?m.createdAt:Date.now()};
  const i=S.data.memories.findIndex(x=>x.id===data.id);
  if(i>=0)S.data.memories[i]=data;else S.data.memories.unshift(data);
  await persist();back.remove();renderRoute();toast('Memory saved.','ok');};}
Object.assign(ACTIONS,{
 'mem-add':()=>memoryForm(),
 'mem-edit':t=>memoryForm(t.dataset.id),
 'mem-view':t=>{S.memView=t.dataset.view;renderRoute();},
 'mem-fav':t=>{const m=S.data.memories.find(x=>x.id===t.dataset.id);if(!m)return;m.favorite=!m.favorite;persist();renderRoute();}});

   ${p!==null?`<div class="row" style="margin-top:12px;gap:10px"><div class="prog"><i style="width:${p}%"></i></div><span class="faint small" style="font-weight:600">${p}%</span></div>`:''}

     <span class="box">${ic('check',11)}</span><span style="flex:1">${esc(ms.text)}</span>

 $('#view').innerHTML=`<div class="page">

  :`<div class="empty"><div class="eico">${ic('target',22)}</div><div class="et">No goals here yet${tab!=='All'?' with this status':''}.</div><div class="ed">A goal written down is a promise to yourself. What matters to you right now?</div><button class="btn btn-primary" data-act="goal-new">${ic('plus',15)} Set your first goal</button></div>`}
 </div>`;
 $$('#view [data-goalstatus]').forEach(sel=>sel.addEventListener('change',()=>{

  g.status=sel.value;persist();}));
 $$('#view [data-goaladd]').forEach(inp=>inp.addEventListener('keydown',e=>{

 /* heatmap: last 12 weeks, Monday-first */

 let heat='';
 for(let w=11;w>=0;w--){

   heat+=`<div class="heat-cell" style="background:${bg}${iso===t?';outline:1px solid var(--accent)':''}" title="${fmtMed(iso)} — ${v} word${v===1?'':'s'}"></div>`;
  }}

 const monthsArr=[];
 for(let i=5;i>=0;i--){const d=new Date(today.getFullYear(),today.getMonth()-i,1);
  const key=`${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
  monthsArr.push({key,label:d.toLocaleDateString('en-GB',{month:'short'}),n:live.filter(e=>e.date.slice(0,7)===key).length});}

 const catMax=Math.max(1,...Object.values(catCounts));

  return `<div class="hbar-row"><span class="hb-l">${esc(n)}</span><div class="prog"><i style="width:${Math.round(v/catMax*100)}%;background:${c?c.color:'var(--accent)'}"></i></div><span class="hb-v">${v}</span></div>`;}).join('')||'<span class="faint small">No entries yet.</span>';
 /* weekday */
 const wdCounts=[0,0,0,0,0,0,0];
 live.forEach(e=>{wdCounts[(parseISO(e.date).getDay()+6)%7]++;});
 const wdMax=Math.max(1,...wdCounts);
 const wdBars=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((l,i)=>`<div class="bar-col"><span class="bv">${wdCounts[i]||''}</span><div class="bar" style="height:${Math.round(wdCounts[i]/wdMax*66)+2}px;opacity:.55"></div><span class="bl">${l}</span></div>`).join('');
 /* tags */
 const tagCounts={};live.forEach(e=>e.tags.forEach(tg=>tagCounts[tg]=(tagCounts[tg]||0)+1));
 const topTags=Object.entries(tagCounts).sort((a,b)=>b[1]-a[1]).slice(0,12);
 const favN=live.filter(e=>e.favorite).length+S.data.memories.filter(m=>m.favorite).length+S.data.ideas.filter(i=>i.favorite).length;
 $('#view').innerHTML=`<div class="page">

  <div class="statgrid" style="grid-template-columns:repeat(4,1fr)">
   <div class="stat"><div class="n">${month}</div><div class="l">Entries this month</div></div>
   <div class="stat"><div class="n">${words.toLocaleString()}</div><div class="l">Words written</div></div>
   <div class="stat"><div class="n">${best}</div><div class="l">Longest streak · now ${cur}</div></div>
   <div class="stat"><div class="n">${live.length?Math.round(words/live.length):0}</div><div class="l">Avg words per entry</div></div>
  </div>
  <div class="grid g2" style="margin-top:4px">
   <div class="card"><div class="overline" style="margin-bottom:14px">Writing activity — last 12 weeks</div><div class="heat">${heat}</div>
    <div class="row" style="gap:6px;margin-top:12px;font-size:11px;color:var(--text3)">less
     <span style="width:12px;height:12px;border-radius:3px;background:var(--card2)"></span>
     <span style="width:12px;height:12px;border-radius:3px;background:color-mix(in srgb,var(--accent) 25%,transparent)"></span>
     <span style="width:12px;height:12px;border-radius:3px;background:color-mix(in srgb,var(--accent) 50%,transparent)"></span>

   <div class="card"><div class="overline" style="margin-bottom:14px">Entries per month</div><div class="bars">${bars}</div></div>

    </div>

   </div>
  </div>
 </div>`;
 if(moodTotal)drawDonut($('#moodDonut'),moodItems);};
function drawDonut(cv,items){
 if(!cv)return;
 const dpr=window.devicePixelRatio||1,size=150,cx=75,cy=75,R=58,r=36;
 cv.width=size*dpr;cv.height=size*dpr;cv.style.width=size+'px';cv.style.height=size+'px';
 const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
 const total=items.reduce((a,b)=>a+b.value,0);
 let ang=-Math.PI/2;
 items.forEach(it=>{
  const a2=ang+it.value/total*Math.PI*2;
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,ang,a2);ctx.closePath();
  ctx.fillStyle=it.color;ctx.fill();
  ctx.strokeStyle='var(--card)';ctx.lineWidth=2;ctx.stroke();
  ang=a2;});
 ctx.globalCompositeOperation='destination-out';
 ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
 ctx.globalCompositeOperation='source-over';}

/* ---------- GLOBAL SEARCH ---------- */
function openSearch(){
 const ov=$('#searchOverlay');ov.classList.remove('hidden');
 S.search=S.search||{q:'',type:'All',cat:'',mood:'',fav:false,from:'',to:''};
 renderSearchFilters();renderSearchResults();
 const inp=$('#spInput');inp.value=S.search.q;setTimeout(()=>inp.focus(),30);}
function closeSearch(){$('#searchOverlay').classList.add('hidden');}
function searchSnip(text,q){
 if(!q)return esc(text.slice(0,120));
 const i=text.toLowerCase().indexOf(q.toLowerCase());
 if(i<0)return esc(text.slice(0,120));
 const s=Math.max(0,i-55);
 return (s>0?'…':'')+esc(text.slice(s,i))+`<mark>${esc(text.slice(i,i+q.length))}</mark>`+esc(text.slice(i+q.length,i+q.length+85))+(i+q.length+85<text.length?'…':'');}
function runSearch(){
 const q=S.search.q.trim();
 const out=[];
 if(q||S.search.fav||S.search.cat||S.search.mood||S.search.from||S.search.to){
  const type=S.search.type;
  if(type==='All'||type==='Entries'){
   let list=liveEntries();
   if(S.search.fav)list=list.filter(e=>e.favorite);
   if(S.search.cat)list=list.filter(e=>e.categoryId===S.search.cat);
   if(S.search.mood)list=list.filter(e=>e.mood===S.search.mood);
   if(S.search.from)list=list.filter(e=>e.date>=S.search.from);
   if(S.search.to)list=list.filter(e=>e.date<=S.search.to);
   if(q)list=list.filter(e=>((e.title||'')+htmlToText(e.html)+e.tags.join(' ')+' '+catName(e.categoryId)).toLowerCase().includes(q.toLowerCase()));
   list.sort(byDateDesc);
   list.slice(0,20).forEach(e=>{
    const txt=(e.title?e.title+' — ':'')+htmlToText(e.html);
    out.push({type:'Entry',icon:'book',id:e.id,title:e.title||'Untitled',snip:searchSnip(txt,q),meta:`${fmtMed(e.date)}${e.mood?' · '+moodById(e.mood).em+' '+moodById(e.mood).label:''}${e.categoryId?' · '+catName(e.categoryId):''}`});});
  }
  if(type==='All'||type==='Memories'){
   S.data.memories.filter(m=>!q||(m.title+' '+(m.description||'')+' '+m.tags.join(' ')).toLowerCase().includes(q.toLowerCase()))
    .slice(0,8).forEach(m=>out.push({type:'Memory',icon:'image',id:m.id,title:m.title||'Untitled memory',snip:searchSnip(m.description||'A saved memory.',q),meta:fmtMed(m.date)}));
  }
  if(type==='All'||type==='Goals'){
   S.data.goals.filter(g=>!q||(g.title+' '+(g.description||'')).toLowerCase().includes(q.toLowerCase()))
    .slice(0,8).forEach(g=>out.push({type:'Goal',icon:'target',id:g.id,title:g.title,snip:searchSnip(g.description||`A ${g.priority.toLowerCase()} priority goal — ${g.status}.`,q),meta:g.status+(g.targetDate?' · by '+fmtMed(g.targetDate):'')}));
  }
  if(type==='All'||type==='Ideas'){
   S.data.ideas.filter(i=>!q||i.text.toLowerCase().includes(q.toLowerCase()))
    .slice(0,8).forEach(i=>out.push({type:'Idea',icon:'bulb',id:i.id,title:i.text.slice(0,60)+(i.text.length>60?'…':''),snip:'',meta:'captured '+fmtDT(i.createdAt)}));
  }
 }
 return out;}

/* ---------- EXPORT / IMPORT ---------- */
function download(name,content,type='text/plain'){
 const blob=new Blob([content],{type});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download=name;
 document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);}
function htmlToMd(h){
 let s=(h||'')
  .replace(/<h2[^>]*>(.*?)<\/h2>/gi,'\n## $1\n').replace(/<h3[^>]*>(.*?)<\/h3>/gi,'\n### $1\n')
  .replace(/<blockquote[^>]*>(.*?)<\/blockquote>/gi,'\n> $1\n')
  .replace(/<ul class="ck"[^>]*>(.*?)<\/ul>/gi,(m,inner)=>'\n'+inner.replace(/<li[^>]*>/gi,'- ').replace(/<\/li>/gi,'\n'))
  .replace(/<ul[^>]*>(.*?)<\/ul>/gi,(m,inner)=>'\n'+inner.replace(/<li[^>]*>/gi,'- ').replace(/<\/li>/gi,'\n'))
  .replace(/<ol[^>]*>(.*?)<\/ol>/gi,(m,inner)=>{let n=0;return '\n'+inner.replace(/<li[^>]*>/gi,()=>`${++n}. `).replace(/<\/li>/gi,'\n');})
  .replace(/<img[^>]*src="data:[^"]*"[^>]*>/gi,'_[image]_')
  .replace(/<a[^>]*href="([^"]*)"[^>]*>(.*?)<\/a>/gi,'[$2]($1)')
  .replace(/<(strong|b)>(.*?)<\/\1>/gi,'**$2**').replace(/<(em|i)>(.*?)<\/\1>/gi,'*$2*')
  .replace(/<hr[^>]*>/gi,'\n---\n').replace(/<br[^>]*>/gi,'\n').replace(/<\/p>/gi,'\n').replace(/<p[^>]*>/gi,'');
 const d=document.createElement('textarea');d.innerHTML=s;s=d.value;
 return s.replace(/\n{3,}/g,'\n\n').trim();}
function entryToMd(e){
 const mood=moodById(e.mood);
 let s=`## ${fmtMed(e.date)} — ${e.title||'Untitled'}\n\n`;
 const meta=[catName(e.categoryId),mood?mood.em+' '+mood.label:null,e.tags.length?'tags: '+e.tags.join(', '):null].filter(Boolean).join(' · ');
 if(meta)s+=`_${meta}_\n\n`;
 s+=htmlToMd(e.html)+'\n';
 const refl=Object.entries(e.reflection||{});
 if(refl.length){s+='\n**Reflection:**\n'+refl.map(([k,v])=>{const q=REFLECTIONS.find(r=>r[0]===k);return `- _${q?q[1]:k}_ ${v}`;}).join('\n')+'\n';}
 return s;}
function exportJSON(){
 const payload={app:'My Personal Diary',version:MPD_VERSION,exportedAt:new Date().toISOString(),data:S.data};
 download(`my-diary-backup-${todayISO()}.json`,JSON.stringify(payload,null,1),'application/json');
 toast('Backup downloaded — keep it somewhere safe.','ok');}
function exportMD(){
 const live=[...liveEntries()].sort((a,b)=>a.date<b.date?-1:1);
 let md=`# My Personal Diary\n\n> My Life. My Thoughts. My Story.\n\n_Exported ${fmtLong(todayISO())} · ${live.length} entries_\n\n---\n\n`;
 md+=live.map(entryToMd).join('\n---\n\n');
 if(S.data.memories.length){md+='\n\n## Saved Memories\n\n'+S.data.memories.map(m=>`- **${fmtMed(m.date)} — ${m.title}**${m.description?': '+m.description:''}${m.images&&m.images.length?` _[${m.images.length} photo${m.images.length>1?'s':''}]_`:''}`).join('\n');}
 if(S.data.goals.length){md+='\n\n## Goals\n\n'+S.data.goals.map(g=>`- **${g.title}** — ${g.status}${g.targetDate?` (by ${fmtMed(g.targetDate)})`:''}${g.milestones.length?'\n  - '+g.milestones.map(x=>(x.done?'[x] ':'[ ] ')+x.text).join('\n  - '):''}`).join('\n');}
 if(S.data.ideas.length){md+='\n\n## Ideas Vault\n\n'+S.data.ideas.map(i=>`- ${i.text}`).join('\n');}
 download(`my-diary-${todayISO()}.md`,md,'text/markdown');
 toast('Markdown export downloaded.','ok');}
function buildPrintDoc(title,entriesHtml){
 $('#printRoot').innerHTML=`<h1>My Personal Diary</h1><div class="pr-sub">My Life. My Thoughts. My Story. — ${esc(title)}</div>${entriesHtml}`;
 setTimeout(()=>window.print(),120);}
function printEntries(list,label){

  <div class="pr-meta">${[catName(e.categoryId),moodById(e.mood)?.label,e.tags.join(', ')].filter(Boolean).join(' · ')||'&nbsp;'}</div>
  <div class="pr-body">${e.html||''}${Object.entries(e.reflection||{}).length?`<div class="pr-meta" style="margin-top:8px">${Object.entries(e.reflection).map(([k,v])=>`<strong>${REFLECTIONS.find(r=>r[0]===k)?.[1]||k}:</strong> ${esc(v)}<br>`).join('')}</div>`:''}</div></div>`).join('');
 buildPrintDoc(label,html);}
$('#importInput').addEventListener('change',async ev=>{
 const f=ev.target.files[0];if(!f)return;
 try{
  const text=await f.text();
  const obj=JSON.parse(text);
  const data=obj.data||obj;
  if(!data||!Array.isArray(data.entries)||!data.settings)throw new Error('This does not look like a My Personal Diary backup.');
  const ok=await confirmDlg({title:'Restore this backup?',danger:true,ok:'Replace my diary',
   msg:`Found <strong>${data.entries.length} entries</strong>, ${data.memories.length||0} memories, ${data.goals.length||0} goals and ${data.ideas.length||0} ideas (exported ${obj.exportedAt?fmtMed(todayISO(new Date(obj.exportedAt))):'unknown date'}). <strong>Your current diary will be replaced.</strong> Export a fresh backup first if unsure.`});
  if(!ok)return;
  S.data=migrate(data);persist();applyTheme();document.documentElement.dataset.font=S.data.settings.fontScale||'m';renderShell();renderRoute();

 ev.target.value='';});

 $('#stPwBtn').onclick=async()=>{
  const msg=$('#stPwMsg');
  const cur=$('#stPwCur').value,n1=$('#stPwNew').value,n2=$('#stPwNew2').value;
  msg.textContent='';msg.style.color='var(--danger)';
  const fail=t=>{msg.textContent=t;};
  if(!cur||!n1)return fail('Fill in all fields.');
  if(n1.length<8)return fail('New password needs at least 8 characters.');
  if(n1!==n2)return fail('New passwords do not match.');
  try{
   const old=await deriveKeys(cur,b64ToBuf(S.meta.salt));
   await decJSON(old.aesKey,S.meta.check);
  }catch(ex){return msg.textContent='Current password is incorrect.';}
  msg.textContent='Re-encrypting…';msg.style.color='var(--text2)';
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const keys=await deriveKeys(n1,salt);
  S.meta.salt=bufToB64(salt);
  S.meta.check=await encJSON(keys.aesKey,{chk:1});
  S.keys=keys;
  localStorage.setItem(K_META,JSON.stringify(S.meta));
  await persist();
  stayUnlockedSync();
  $('#stPwCur').value='';$('#stPwNew').value='';$('#stPwNew2').value='';
  msg.textContent='Password changed — your diary was re-encrypted.';msg.style.color='var(--ok)';
  toast('Password changed successfully.','ok');};
 $('#stRemOn').onchange=e=>{r.enabled=e.target.checked;
  if(r.enabled&&window.Notification&&Notification.permission==='default')Notification.requestPermission();
  persist();renderRoute();};
 $$('.stDay').forEach(cb=>cb.addEventListener('change',()=>{
  const d=new Set(r.days);cb.checked?d.add(Number(cb.value)):d.delete(Number(cb.value));
  r.days=[...d].sort();persist();renderRoute();}));
 $('#stRemTime').onchange=e=>{r.time=e.target.value;persist();};
 $('#stRemMsg').onchange=e=>{r.message=e.target.value;persist();};
 $('#stRemTest').onclick=()=>{
  if(!window.Notification)return toast('Notifications are not supported in this browser.','error');
  if(Notification.permission!=='granted'){Notification.requestPermission().then(p=>{if(p==='granted')fireTest();else toast('Permission denied — reminders will show inside the app only.','error');});}
  else fireTest();
  function fireTest(){try{new Notification('My Personal Diary',{body:r.message});}catch(_){}
   toast(r.message,'ok');}};
 $$('#stCats [data-catname]').forEach(inp=>inp.addEventListener('change',()=>{
  const c=catById(inp.dataset.catname);if(!c)return;
  const v=inp.value.trim();if(!v){inp.value=c.name;return toast('Category name cannot be empty.','error');}
  c.name=v;persist();toast('Category renamed.','ok');}));
 $$('#stCats [data-catcol]').forEach(inp=>inp.addEventListener('change',()=>{
  const c=catById(inp.dataset.catcol);if(!c)return;c.color=inp.value;persist();renderRoute();}));
 $('#newCatBtn').onclick=()=>{
  const name=$('#newCatName').value.trim();
  if(!name)return toast('Give the category a name.','error');
  S.data.categories.push({id:uid(),name,color:$('#newCatColor').value});
  persist();renderRoute();toast('Category added.','ok');};
 $('#delBtn').onclick=async()=>{
  if($('#delConfirm').value!=='DELETE')return toast('Type DELETE to confirm — this erases everything.','error');
  if(!await confirmDlg({title:'Delete everything?',danger:true,ok:'Erase my diary forever',msg:'Every entry, memory, goal and idea will be permanently erased from this browser. This cannot be undone.'}))return;
  localStorage.removeItem(K_META);localStorage.removeItem(K_DATA);localStorage.removeItem(K_DRAFT);sessionStorage.removeItem(K_KEY);
  location.reload();};};
Object.assign(ACTIONS,{
 'export-json':()=>exportJSON(),
 'export-md':()=>exportMD(),
 'print-all':()=>printEntries([...liveEntries()].sort((a,b)=>a.date<b.date?-1:1),'All entries'),
 'import-json':()=>$('#importInput').click(),
 'cat-del':async t=>{
  const c=catById(t.dataset.id);if(!c)return;
  const n=S.data.entries.filter(e=>e.categoryId===c.id).length+S.data.memories.filter(m=>m.categoryId===c.id).length;
  if(!await confirmDlg({title:'Delete “'+esc(c.name)+'”?',danger:true,ok:'Delete category',msg:n?`${n} item${n===1?'':'s'} use this category — they will become “Uncategorized”.`:'No items use this category.'}))return;
  S.data.categories=S.data.categories.filter(x=>x.id!==c.id);
  S.data.entries.forEach(e=>{if(e.categoryId===c.id)e.categoryId=null;});
  S.data.memories.forEach(m=>{if(m.categoryId===c.id)m.categoryId=null;});
  if(S.data.settings.defaultCategory===c.id)S.data.settings.defaultCategory=null;
  persist();renderRoute();toast('Category deleted.','ok');}});

/* ---------- REMINDERS ---------- */
function startReminders(){
 if(window.__remTimer)clearInterval(window.__remTimer);
 window.__remTimer=setInterval(()=>{
  if(!S.data)return;
  const r=S.data.settings.reminder;
  if(!r.enabled)return;
  const now=new Date(),t=todayISO();
  const hm=`${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
  if(hm===r.time&&r.days.includes(now.getDay())&&r.lastFired!==t){
   r.lastFired=t;persist();
   const body=r.message||'Take a few minutes for yourself. Write today\u2019s story.';
   try{if(window.Notification&&Notification.permission==='granted')new Notification('My Personal Diary',{body});}catch(_){}
   toast('⏰ '+body,'ok',{ttl:9000});
  }
 },20000);}

/* ---------- boot it ---------- */
boot();

</script>
</body>
